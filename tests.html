<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daymark unit tests</title>
  <style>
    * { box-sizing: border-box; }
    body { max-width: 780px; margin: 45px auto; padding: 0 20px; background: #f6f5f0; color: #202a25; font: 14px/1.6 'Segoe UI', sans-serif; }
    h1 { margin-bottom: 4px; font: 32px Georgia, serif; }
    p { margin-top: 0; color: #778079; }
    #summary { margin: 22px 0 12px; font-weight: 700; }
    #results { padding: 0; list-style: none; }
    li { margin: 7px 0; padding: 10px 13px; border: 1px solid #e4e5dc; border-radius: 4px; background: #fffefa; }
    li.pass::before { color: #35634c; content: 'PASS  '; font-weight: 700; }
    li.fail { border-color: #d06b54; }
    li.fail::before { color: #b44f3e; content: 'FAIL  '; font-weight: 700; }
    #summary.failed { color: #b44f3e; }
  </style>
  <script src="task-store.js" defer></script>
  <script src="tests.js" defer></script>
</head>
<body>
  <h1>Daymark unit tests</h1>
  <p>Browser-based tests for every public task-store function.</p>
  <div id="summary" role="status" aria-live="polite">Running tests...</div>
  <ul id="results"></ul>
</body>
</html>
